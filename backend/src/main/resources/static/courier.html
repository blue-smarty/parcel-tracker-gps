<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>ParcelPilot — Courier</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/courier.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/courier.html" aria-label="ParcelPilot courier home">
        <span class="brand-mark">P</span>
        <span>parcel<span class="brand-light">pilot</span></span>
      </a>
      <div class="topbar-right">
        <span class="demo-tag">COURIER</span>
        <span class="account-chip">Signed in as <strong id="accountName">…</strong></span>
        <button id="signOutButton" class="button button-quiet" type="button">Sign out</button>
      </div>
    </header>
    <main>
      <section id="courierView" class="view" hidden>
        <div class="section-heading">
          <div><p class="eyebrow">COURIER WORKSPACE</p><h2>Your deliveries.</h2></div>
          <button class="button button-quiet" id="refreshButton" type="button">↻ <span>Refresh</span></button>
        </div>
        <p id="courierMessage" class="form-message" role="status"></p>
        <div id="deliveryList"><div class="panel"><div class="empty-state">Loading deliveries…</div></div></div>
      </section>
    </main>
    <footer><span>PARCELPILOT <b>·</b> COURIER</span><span>Deliveries refresh every 30 seconds.</span></footer>
  </div>
</body>
</html>
