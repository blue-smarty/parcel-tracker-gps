<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParcelPilot — Address book</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/address-book.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">P</span><span>parcel<span class="brand-light">pilot</span></span></a>
      <div class="topbar-right">
        <span class="account-chip">Signed in as <strong id="accountName">…</strong></span>
        <button id="signOutButton" class="button button-quiet" type="button">Sign out</button>
      </div>
    </header>
    <main>
      <section id="addressBookView" class="view" hidden>
        <div class="section-heading">
          <div><p class="eyebrow">SAVED ADDRESSES</p><h2>Address book</h2></div>
          <a id="backLink" class="button button-quiet" href="/">Back</a>
        </div>
        <section class="panel settings-panel">
          <form id="customerLookup" class="settings-form" hidden>
            <label>Customer account email<input id="customerEmail" type="email" maxlength="255" required></label>
            <button class="button button-secondary" type="submit">Open address book</button>
          </form>
          <div id="bookContent" hidden>
            <h3 id="bookTitle">Your addresses</h3>
            <div id="addressList"></div>
            <form id="addressForm" class="settings-form">
              <label>Label<input id="addressLabel" maxlength="100" placeholder="Home, office…" required></label>
              <label>Address<input id="addressValue" maxlength="255" autocomplete="street-address" required></label>
              <div class="settings-actions">
                <button id="saveAddress" class="button button-primary" type="submit">Add address</button>
                <button id="cancelEdit" class="button button-quiet" type="button" hidden>Cancel edit</button>
              </div>
            </form>
          </div>
          <p id="addressMessage" class="form-message" role="status" aria-live="polite"></p>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
