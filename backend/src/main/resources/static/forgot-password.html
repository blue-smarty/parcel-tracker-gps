<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>ParcelPilot — Reset password</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/password-reset.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="ParcelPilot home">
        <span class="brand-mark">P</span>
        <span>parcel<span class="brand-light">pilot</span></span>
      </a>
      <div class="topbar-right"><span class="demo-tag">ACCOUNT RECOVERY</span></div>
    </header>
    <main class="auth-main">
      <div class="panel auth-panel">
        <h2 id="resetHeading">Forgot your password?</h2>
        <p id="resetDescription" class="field-note">Enter the email address on your customer account. If an account exists, we’ll email a reset link.</p>
        <form id="requestResetForm" class="auth-form">
          <label>Email<input id="resetEmail" type="email" autocomplete="email" maxlength="200" required></label>
          <button id="requestResetButton" class="button button-primary full-button" type="submit">Send reset link</button>
        </form>
        <form id="confirmResetForm" class="auth-form" hidden>
          <label>New password (12+ characters)<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
          <label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
          <button id="confirmResetButton" class="button button-primary full-button" type="submit">Update password</button>
        </form>
        <p id="resetMessage" class="form-message" role="status"></p>
        <a class="field-note" href="/login.html">Back to sign in</a>
      </div>
    </main>
    <footer><span>PARCELPILOT <b>·</b> ACCOUNT SECURITY</span><span>Reset links expire after 30 minutes.</span></footer>
  </div>
</body>
</html>
