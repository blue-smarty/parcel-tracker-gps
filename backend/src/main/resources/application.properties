server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/parceltracker
spring.data.mongodb.auto-index-creation=true

# Optional one-time courier account provisioning. Use environment variables for deployment.
parcel.auth.bootstrap-courier-id=${PARCEL_BOOTSTRAP_COURIER_ID:}
parcel.auth.admin-username=${PARCEL_ADMIN_USERNAME:}
parcel.auth.admin-password=${PARCEL_ADMIN_PASSWORD:}
parcel.auth.bootstrap-******

# Scheduled jobs (set parcel.scheduler.enabled=false to disable all; per-job flags below)
parcel.scheduler.enabled=true
parcel.scheduler.stale-assigned.enabled=true
parcel.scheduler.stale-assigned.cron=0 */10 * * * *
parcel.scheduler.stale-assigned.threshold=PT2H
parcel.scheduler.stale-assigned.unassign=false
parcel.scheduler.location-inactivity.enabled=true
parcel.scheduler.location-inactivity.cron=0 */5 * * * *
parcel.scheduler.location-inactivity.threshold=PT15M
parcel.scheduler.auto-close.enabled=true
parcel.scheduler.auto-close.cron=0 0 * * * *
parcel.scheduler.auto-close.grace-period=PT24H

# Origins allowed to open tracking WebSockets (comma-separated patterns). Set to your real domains in production.
parcel.security.allowed-origins=${PARCEL_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
server.error.include-message=never
server.error.include-stacktrace=never
